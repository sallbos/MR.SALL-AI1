  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icons/pwa/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MR.SALL AI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="MR.SALL AI">
  <meta name="msapplication-TileColor" content="#080B18">
  <meta name="msapplication-TileImage" content="../assets/icons/pwa/icon-144x144.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="container">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../assets/logo.png" alt="MR.SALL AI Logo" class="nav-logo-img">
        <div class="nav-logo-text"><span>MR.SALL </span><span class="ai-badge">AI</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="../index.html#tools" data-i18n="nav_tools">AI Tools</a></li>
        <li><a href="../founder.html" data-i18n="nav_founder">About Founder</a></li>
        <li><a href="#settings" data-action="settings" data-i18n="nav_settings">Settings</a></li>
      </ul>
      <div class="nav-actions">
        <div class="nav-usage-badge" id="nav-usage-badge" title="Daily message quota" data-action="settings">
          ⚡ <span class="usage-remaining">50</span> left
        </div>
        <button type="button" class="btn-pwa-install" aria-label="Install App">
          <span>⚡</span> <span data-i18n="install_btn">Install App</span>
        </button>
        <select class="lang-select">
          <option value="en">🌐 EN</option>
          <option value="ar">🌐 AR</option>
          <option value="fr">🌐 FR</option>
        </select>
        <button class="theme-toggle" aria-label="Toggle theme">☀️</button>
        <button class="menu-toggle" aria-label="Menu">☰</button>
        <a href="../index.html" class="btn btn-secondary btn-sm" data-i18n="back_home">← Home</a>
      </div>
    </div>
  </div>
</nav>
<div class="mobile-nav">
  <a href="../index.html" data-i18n="nav_home">Home</a>
  <a href="../index.html#tools" data-i18n="nav_tools">AI Tools</a>
  <a href="../founder.html" data-i18n="nav_founder">About Founder</a>
  <select class="lang-select" style="margin-top:8px;">
    <option value="en">🌐 English</option>
    <option value="ar">🌐 العربية</option>
    <option value="fr">🌐 Français</option>
  </select>
</div>

<main class="tool-page">
  <div class="tool-header">
    <div class="container">
      <div class="tool-header-inner">
        <div class="tool-header-icon">💻</div>
        <div class="tool-header-info">
          <h1 data-i18n="code_title">AI Code</h1>
          <p data-i18n="code_desc">Generate, explain, and debug code</p>
        </div>
      </div>
    </div>
  </div>

  <div class="tool-body" id="code-tool-body">
    <div class="container">
      <div class="tool-split-layout">
        <!-- Left: Input -->
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label class="form-label" data-i18n="code_mode">Mode</label>
              <select class="form-select" id="code-mode">
                <option value="generate" data-i18n="code_generate">Generate Code</option>
                <option value="explain" data-i18n="code_explain">Explain Code</option>
                <option value="debug" data-i18n="code_debug">Debug Code</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="code_lang">Language</label>
              <select class="form-select" id="code-lang-select">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="typescript">TypeScript</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="php">PHP</option>
                <option value="sql">SQL</option>
                <option value="bash">Bash</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label" data-i18n="code_input_ph">Your Request or Code</label>
            <textarea
              class="form-textarea"
              id="code-input"
              data-i18n-placeholder="code_input_ph"
              placeholder="Describe what you want to build, or paste your code here..."
              style="min-height:280px;font-family:monospace;"
            ></textarea>
          </div>
          <div style="display:flex;gap:12px;">
            <button class="btn btn-primary w-full" id="code-btn" data-i18n="generate">Generate</button>
            <button class="btn btn-secondary" id="code-clear-btn" data-i18n="clear">Clear</button>
          </div>
        </div>

        <!-- Right: Output -->
        <div>
          <div class="code-output" id="code-output" style="display:none;">
            <div class="code-header">
              <span class="code-lang" id="code-lang-badge"></span>
              <button class="btn btn-ghost btn-sm" id="code-copy-btn" style="color:#8b949e;" data-i18n="copy">📋 Copy</button>
            </div>
            <pre class="code-body" id="code-output-text"></pre>
          </div>
          <div id="code-placeholder" style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.875rem;">
            <div style="text-align:center;">
              <div style="font-size:48px;margin-bottom:12px;">💻</div>
              <p>Generated code will appear here</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/theme.js"></script>
<script src="../js/language.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pwa.js"></script>
<script src="../js/tools.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
